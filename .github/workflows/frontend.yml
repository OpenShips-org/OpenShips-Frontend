name: Build Frontend

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tile server via Google DNS
        id: dns
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils

          IP=$(dig @8.8.8.8 +short A tiles.openships.de | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)

          if [ -z "$IP" ]; then
            echo "Failed to resolve tiles.openships.de via Google DNS"
            exit 1
          fi

          echo "Resolved tiles.openships.de to $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: alexius25
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          add-hosts: |
            tiles.openships.de:${{ steps.dns.outputs.ip }}
          tags: |
            ghcr.io/alexius25/openships-frontend:latest
            ghcr.io/alexius25/openships-frontend:${{ github.sha }}