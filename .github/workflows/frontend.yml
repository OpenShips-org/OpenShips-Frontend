name: Build Frontend

on:
    push:
        branches:
            - master

permissions:
    contents: read
    packages: write

jobs:
    docker:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Test tile server connectivity
              run: |
                  curl -v --resolve tiles.openships.de:443:85.215.236.30 \
                  https://tiles.openships.de/

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: alexius25
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ghcr.io/alexius25/openships-frontend:latest
                      ghcr.io/alexius25/openships-frontend:${{ github.sha }}
