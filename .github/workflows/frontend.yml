name: Build Frontend

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test tile server connectivity
        run: |
          echo "=== DNS ==="
          getent hosts tiles.openships.de || true

          echo "=== IPv4 ==="
          curl -4 -v --connect-timeout 10 https://tiles.openships.de/ || true

          echo "=== IPv6 ==="
          curl -6 -v --connect-timeout 10 https://tiles.openships.de/ || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: alexius25
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/alexius25/openships-frontend:latest
            ghcr.io/alexius25/openships-frontend:${{ github.sha }}
